name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # The Laravel application lives in SIGA/, not at the repository root:
    # composer.json, package.json and artisan are all one level down. The
    # workflow file itself cannot follow them there -- GitHub only reads
    # .github/workflows from the root -- so the run steps are pointed at
    # SIGA instead. The `uses:` steps need no working directory.
    defaults:
      run:
        working-directory: SIGA

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      # RE-01 and RE-02 assert that a real .pdf comes out, and that PDF is
      # rendered by Chromium through Puppeteer. Puppeteer downloads its
      # browser from a postinstall script, and .npmrc sets ignore-scripts=true
      # on purpose, so `npm install` inside `composer setup` never fetches it
      # and the runner's ~/.cache/puppeteer stays empty. Asking for the binary
      # explicitly is the same one-off step the README documents for a local
      # checkout. It has to run after composer setup, which is what installs
      # the puppeteer package that provides this command.
      - name: Install headless Chrome for the PDF exports
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Run CI Checks
        run: composer ci:check
